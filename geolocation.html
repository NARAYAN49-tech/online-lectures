<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="author" content="narayan">
    </head>
    <body>
        <button onclick="geoLocation()">
            Get Location
        </button>
        <p id="result">

        </p>

        <script>
            function geoLocation() {
                if (navigator.geolocation) {
                    navigator.geolocation.getCurrentPosition(
                        function(position) {
                            const lat = position.coords.latitude;
                            const long= position.coords.longitude;

                            document.getElementById("result").innerHTML = `Latitude: ${lat} <br> Longitude: ${long}`;
                        },
                        function(error) {
                            console.log("Location errror: ", error.message);
                        }
                    );
                } else {
                    document.getElementById("result").innerText = "Geolocation is not supported.";
                }
            }
        </script>
    </body>
</html>
