<html>
<head>
<title>Student Navigation Form </title>
</head>
<body>
	<h1>Form Details</h1>
	<form>
		<label>First Name</label>
		<input type="text" name="fname" placeholder="First Name"> <br>
		<label>Last Name</label>
		<input type="text" name="lname" placeholder="Last Name"> <br>
		<label>Age</label>
		<input type="number" min="0" max="110" name="age" placeholder="Age"> <br>
		<br>
		<label> Date </label>
		<input type="date" name="date">
		<br>
		<input type="email" placeholder="Email">
		<br>
		<br>
		<h3>Educational Details</h3>
		<label>Qualifications</label>
		<select id="days" name="days" >
			<input type="radio" name="10th" selected>
			<input type="radio" name="12th">
			<input type="radio" name="Graduation">
			<input type="radio" name="Post Graduation">
		</select> <br>
		
		<input type="checkbox" ><label>All terms And conditions </label>
		<input type="submit" >
		
	</form>
</body>
</html>
