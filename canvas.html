<!DOCTYPE html>
<html>
<head>
<title>canvas</title>
</head>
<body>
<canvas id="myCanvas" width="500" height="500" style="border: 4px black yellow"></canvas>

<script>
	var canvas = document.getElementById("myCanvas");
	var ctx = canvas.getContext('2d');
	ctx.fillStyle = "#ff0000";
	ctx.fillRect(50,40, 100, 100);
</script>
</body>
</html>
