<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inline HTML</title>
    <!-- Inline css is applied within HTML element using 'style' attribute -->
</head>
<body>
    <h1>Inline CSS</h1>
    <div style="width: 200px; border: 3px solid black; height: 300px;">
        <b>Welcome</b>
    </div>
</body>
</html>
