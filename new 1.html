<!DOCTYPE html>
<html>
	<head>
		<title>Lists In HTML</title>
	<head>
	<body>
		<h1>Let's Explore Lists In HTML</h1>
		<h3>Unordered List</h3>
		<ul type="square">
			<li>Triangle</li>
			<li>Square</li>
			<li>Pentagon</li>
			<li>Hexagon</li>
		</ul>
		
		<br><br><br>
		<h3>Ordered List</h3>
		<ol type="i">
			<li>One</li>
			<li>Two</li>
			<li>Three</li>
			<li>Four</li>
		</ol>
	</body>
</html>
