<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Span</title>
        <style>
            .text-color {
                color: red;
                font-weight: bold;
            }
            .text-required {
                color: aqua;
                font-weight: bolder;
            }
        </style>
    </head>

    <body>
        <div>
            <h1>Span Example</h1>
            <p>Happy <span class="text-color">Teachers</span> Day</p>
            <label for="">Name: <span class="text-required">*</span></label>
        </div>
        
    </body>
</html>
