<!DOCTYPE html>
<html>
	<head>
		<title>Semantic Tags </title>
		<style>
			body {
				justify-content:center;
				align-items: center;
				
				
			}
			h1 {
				text-align: center;
				
			}
			table {
				text-align: center;
				display: flex;
				justify-content: center;
				height : 500px;
				width: 400px;
				align-items: center;
				margin-left:700px;
			}
			tr{
				display: flex;
				height :90px;
				width: 370px;
				gap: 5px;
			}
			td {
				display: flex;
				height :90px;
				width: 370px;
				text-align: center;
				align-items: center;
				justify-content: center;
				font-size: 30px;
				gap: 5px;
			}
			
		</style>
	</head>
	<body>
		       <h1>Semantic Elements in HTML</h1>
			  <table border="1" > 
				<tr style="background-color: red;">
					<td colspan="5">Header</td>
				</tr>
				<tr style="background-color: blue;">
					<td colspan="5">Nav</td>
				</tr>
				<tr>
					<td colspan="3" style="width:240px; background-color:yellow;">Section</td>
					<td rowspan="2" style="width:110px; height: 180px; background-color: green;">Aside</td>
				</tr>
				<tr>
					<td colspan="3" style="width:240px; background-color: brown;">Article</td>
				</tr>
				<tr>
					<td colspan="5" style="background-color: pink;">Footer</td>
				</tr>
			  </table>
	</body>
</html>
