<!DOCTYPE html>
<html lang="en">

<head>

</head>
<body>
	<img src="https://www.w3schools.com/html/img_girl.jpg" width="300" height="305" alt="Girl with a jacket" />
	
	<canvas id="myCanvas" width="400" height="400" style="border: 1px solid #000000;">
	
	</canvas>
	<p title="I'm a tooltip"> This is a paragraph. </p>
	
	<script>
		var canvas = document.getElementById("myCanvas");
		var ctx = canvas.getContext("2d");
		
		ctx.fillStyle = "#ff0000";
		ctx.fillRect(20,20,150,100);
		
		ctx.beginPath();
		ctx.arc(250, 100,80,0, 2*Math.PI);
		ctx.fill();
		
		ctx.beginPath();
		ctx.moveTo(100,450);
		ctx.lineTo(204,50);
		ctx.lineTo(450, 250);
		ctx.closePath();
		ctx.fill();
		
		
	</script>

</body>

</html>
